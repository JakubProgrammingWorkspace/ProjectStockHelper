[project]
name = "stockhelper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.5,<6.0.0",
    "django-cors-headers>=4.9.0,<5.0.0",
    "django-environ>=0.13.0,<1.0.0",
    "django-redis>=6.0.0,<7.0.0",
    "ephem>=4.2.0,<5.0.0",
    "openai>=2.32.0,<3.0.0",
    "psycopg2-binary>=2.9.10,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv>=1.2.1,<2.0.0",
    "requests>=2.32.5,<3.0.0",
    "sec2md>=0.1.20,<1.0.0",
    "selectolax>=0.4.6,<1.0.0",
    "tqdm>=4.67.1,<5.0.0",
    "yfinance>=0.2.66,<1.0.0",
]

[project.optional-dependencies]
production = [
    "gunicorn>=23.0.0,<24.0.0",
    "whitenoise>=6.9.0,<7.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0,<1.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-django>=4.8.0,<5.0.0",
    "pylint>=4.0.5,<5.0.0",
    "vulture>=2.16.0,<3.0.0",
    "pytest-mock>=3.15.1",
    "responses>=0.26.0",
    "factory-boy>=3.3.3",
    "pytest-cov>=7.1.0",
    "freezegun>=1.5.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/settings/*.py" = ["F403", "F405"]
"**/sec_submissions.py" = ["E501"]
"**/llm_prompt_config.py" = ["E501"]
"**/open_api_llm_handler.py" = ["E501"]

[tool.pylint.main]
# Only run the similarity checker
disable = "all"
enable = "similarities"
ignore-paths = [".*/migrations/.*"]

[tool.pylint.similarities]
min-similarity-lines = 4
ignore-comments = "yes"
ignore-docstrings = "yes"
ignore-imports = "yes"
ignore-signatures = "yes"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = "test_*.py"
testpaths = ["apps"]
addopts = "--nomigrations --reuse-db --cov=apps --cov-report=term-missing"
markers = [
    "django_db: marks tests that require a database",
]
