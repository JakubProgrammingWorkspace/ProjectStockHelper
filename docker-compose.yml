services:
  db:
    image: postgres:16
    container_name: ${PROJECT_NAME:-stock_helper}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-django_db}
      POSTGRES_USER: ${DATABASE_USER:-django_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-django_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER:-django_user} -d ${DATABASE_NAME:-django_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
      target: development
      args:
        - UID=${UID}
        - GID=${GID}
    container_name: ${PROJECT_NAME:-stock_helper}_web
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG:-True}
      - DATABASE_ENGINE=django.db.backends.postgresql
      - DATABASE_NAME=${DATABASE_NAME:-django_db}
      - DATABASE_USER=${DATABASE_USER:-django_user}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-django_password}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
    volumes:
      - .:/app:rw,delegated # :delegated is because of mac os
    command: >
      bash -cx " uv sync --frozen --no-install-project --dev &&  uv run python manage.py runserver 0.0.0.0:8000 "
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: docker/react/Dockerfile
      args:
        - UID=${UID}
        - GID=${GID}
    container_name: ${PROJECT_NAME:-stock_helper}_react
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./frontend:/app:rw,delegated # :delegated is because of mac os
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true # Enable hot reload in Docker
      - REACT_APP_API_URL=http://localhost:${WEB_PORT:-8000}
      - GENERATE_SOURCEMAP=true
    command: sh -c "npm install && npm start"
    stdin_open: true
    tty: true
    networks:
      - app_network
    env_file:
      - .env
  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:-stock_helper}_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    env_file:
      - .env

  test-e2e:
    image: mcr.microsoft.com/playwright:v1.59.1-jammy
    container_name: ${PROJECT_NAME:-stock_helper}_e2e
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - CI=true
    command: bash /app/frontend/e2e/run-e2e.sh
    depends_on:
      web:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - app_network

volumes:
  postgres_data:
    name: ${PROJECT_NAME:-stock_helper}_postgres_data
  redis_data:
    name: ${PROJECT_NAME:-stock_helper}_redis_data

networks:
  app_network:
    driver: bridge
